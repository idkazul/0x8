<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0x8</title>
  <link rel="icon" href="imgs/icon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
  <script type="module">
    import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
    window.BareMux = BareMux;
  </script>
</head>
<body>

  <div id="loading-screen">
    <img src="imgs/logo.png" alt="0x8" class="loading-logo" />
    <div class="loading-track"><div class="loading-bar"></div></div>

  </div>

  <div id="app">
    <div class="bg-orb" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--bottom" aria-hidden="true"></div>

    <header class="header">
      <img src="imgs/logo.png" alt="0x8" class="header-logo" id="headerLogo" />
      <div class="tab-bar" id="tabsContainer" role="tablist"></div>
      <div class="header-controls">
        <button class="header-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
        <button class="header-btn" id="settingsBtn"><i class="fa-solid fa-gear"></i></button>
      </div>
    </header>

    <div class="nav-bar">
      <button class="nav-btn" id="backBtn"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="nav-btn" id="fwdBtn"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="nav-btn" id="reloadBtn"><i class="fa-solid fa-rotate-right"></i></button>
      <div class="address-wrapper">
        <i class="fa-solid fa-lock lock-icon"></i>
        <input type="text" id="addressBar" placeholder="Search or enter URL" autocomplete="off" />
      </div>
    </div>

    <div class="loading-bar-container"><div class="loading-bar-progress" id="loadingBar"></div></div>

    <div class="main-content">
      <div class="brand-col" id="brandCol">
        <img src="imgs/logo.png" alt="0x8" class="big-logo" />
        <h1>0x8</h1>
        <p>A simple site to browse stuff!</p>
        <span class="tagline">v1.0</span>
      </div>
      <div class="viewport" id="viewport"></div>
    </div>
  </div>

  <div class="modal-overlay" id="wispModal">
    <div class="modal-card">
      <div style="display:flex;align-items:center;margin-bottom:16px;">
        <h2><i class="fa-solid fa-server"></i> Proxy Settings</h2>
        <button class="close-btn" id="closeWispModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="section-title"><i class="fa-solid fa-cloud"></i> Select Server</div>
      <div class="server-list" id="serverList"></div>
      <div class="section-title"><i class="fa-solid fa-plus-circle"></i> Custom Server</div>
      <div class="custom-input-group">
        <input type="text" id="customWispInput" placeholder="wss://your-wisp-server.com/wisp/" />
        <button id="saveCustomWisp"><i class="fa-solid fa-plus"></i></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="shortcutModal">
    <div class="modal-card" style="max-width:400px;">
      <div style="display:flex;align-items:center;margin-bottom:16px;">
        <h2><i class="fa-solid fa-plus-circle"></i> Add Shortcut</h2>
        <button class="close-btn" id="closeShortcutModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="shortcutForm">
        <div style="margin-bottom:12px;">
          <label style="display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;">Name</label>
          <input type="text" id="shortcutName" placeholder="e.g. My Site" style="width:100%;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text-primary);font-size:13px;font-family:var(--font);outline:none;" />
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;">URL</label>
          <input type="text" id="shortcutUrl" placeholder="https://example.com" style="width:100%;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text-primary);font-size:13px;font-family:var(--font);outline:none;" />
        </div>
        <button type="submit" style="width:100%;padding:10px;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-sm);color:var(--text-primary);font-size:14px;font-family:var(--font);cursor:pointer;transition:var(--transition);">Add Shortcut</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-card" style="max-width:400px;">
      <div style="display:flex;align-items:center;margin-bottom:16px;">
        <h2><i class="fa-solid fa-trash"></i> Remove Server</h2>
        <button class="close-btn" id="closeConfirmModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p style="color:var(--text-secondary);margin-bottom:20px;">Are you sure you want to remove this server?</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="confirmDeleteNo" style="padding:8px 16px;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-sm);color:var(--text-secondary);cursor:pointer;font-family:var(--font);font-size:13px;">Cancel</button>
        <button id="confirmDeleteYes" style="padding:8px 16px;background:#f44336;border:none;border-radius:var(--radius-sm);color:white;cursor:pointer;font-family:var(--font);font-size:13px;">Remove</button>
      </div>
    </div>
  </div>

  <div id="toast-container" role="status" aria-live="polite"></div>

  <script src="js/utils.js" defer></script>
  <script src="js/proxy.js" defer></script>
  <script src="js/tabs.js" defer></script>
  <script src="js/settings.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
